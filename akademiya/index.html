</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><i>O</i><span>Orbita Akademiya<small>Navro’z Orbitasi</small></span></a>
    <nav class="nav" id="nav">
      <a href="#/" data-r="home">Kurslar</a>
      <a href="#/narxlar" data-r="narxlar">Narxlar</a>
      <a href="#/sertifikat" data-r="sertifikat">Sertifikat tekshirish</a>
      <a href="../">Portfolio</a>
    </nav>
    <button class="me" id="meBtn" type="button"><b id="meIni">?</b><span id="meName">Kirish</span></button>
  </div>
</header>

<main id="app" class="wrap" aria-live="polite"></main>

<footer>
  <div class="wrap">
    <span>© 2026 Orbita Akademiya · <a href="../">Navro’z Orbitasi</a></span>
    <span>Savol bormi? <a href="../#aloqa">Bog‘lanish</a> · <a href="#/narxlar">To‘lov va qaytarish</a></span>
  </div>
</footer>

<button class="aifab" id="aiFab" type="button" aria-label="AI ustoz"><span class="ping"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></button>
<section class="ai" id="ai" hidden aria-label="AI ustoz">
  <header>
    <span class="av"></span>
    <div><b>Orbita AI ustoz</b><small id="aiMode">Savol bering — tushuntiraman va darsni ochaman</small></div>
    <div class="sp">
      <button type="button" id="aiVoice" title="Javobni ovozda o‘qish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
      <button type="button" id="aiClose" title="Yopish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </header>
  <div class="msgs" id="aiMsgs"></div>
  <div class="sugg" id="aiSugg"></div>
  <form id="aiForm">
    <button type="button" class="mic" id="aiMic" title="Ovozli savol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <input id="aiIn" autocomplete="off" placeholder="Masalan: for sikli nima? yoki SQL 5-darsni och" aria-label="Savol">
    <button type="submit" aria-label="Yuborish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg></button>
  </form>
</section>

<div class="modal" id="modal" hidden><div class="bk" data-close></div><div class="box" id="mbox"></div></div>
<div class="toasts" id="toasts"></div>

<script src="../edu-bg.js"></script>
<script src="app.js"></script>
